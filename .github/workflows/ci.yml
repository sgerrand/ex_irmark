name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Tests [Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.16'
            otp: '24'
          - elixir: '1.16'
            otp: '25'
          - elixir: '1.16'
            otp: '26'
          - elixir: '1.17'
            otp: '25'
          - elixir: '1.17'
            otp: '26'
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.18'
            otp: '25'
          - elixir: '1.18'
            otp: '26'
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '26'
          - elixir: '1.19'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '27'
          - elixir: '1.20'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
            lint: true

    env:
      MIX_ENV: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{matrix.elixir}}
        otp-version: ${{matrix.otp}}
    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _build
          deps
        key: ${{ runner.os }}-${{ env.MIX_ENV }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ env.MIX_ENV }}-${{ matrix.otp }}-${{ matrix.elixir }}-
    - name: Install and compile dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: mix do deps.get --only test, deps.compile
    - name: Check code format
      run: mix format --check-formatted
      if: ${{ matrix.lint }}
    - name: Compile code
      run: mix compile --warnings-as-errors
    - name: Run tests
      run: mix test --warnings-as-errors
