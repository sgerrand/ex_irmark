name: Publish

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Hex
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.release.tag_name }}
        persist-credentials: false
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        version-file: .tool-versions
        version-type: strict
    - name: Install dependencies
      run: mix deps.get
    - name: Check the tag matches the version in mix.exs
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        # Without these flags mix compiles first and prints its progress on
        # stdout, so the compiler output ends up in $version.
        version="$(mix run --no-start --no-compile --no-deps-check -e 'IO.puts(Mix.Project.config()[:version])')"
        if [ "$TAG_NAME" != "v$version" ]; then
          echo "Release tag $TAG_NAME does not match mix.exs version $version" >&2
          exit 1
        fi
    - name: Publish package and documentation
      run: mix hex.publish --yes
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
